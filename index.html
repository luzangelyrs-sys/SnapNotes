<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SnapNotes</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0f0f11;--surface:#1a1a1f;--surface2:#222228;--surface3:#2a2a32;
  --border:rgba(255,255,255,0.08);--border2:rgba(255,255,255,0.14);
  --text:#e8e8ec;--text2:#9090a0;--text3:#5a5a6a;
  --accent:#7c6bff;--accent2:#9b8dff;--accent-bg:rgba(124,107,255,0.12);--accent-border:rgba(124,107,255,0.35);
  --green:#4ade80;--red:#f87171;--radius:10px;--radius-sm:6px;
}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--text);height:100vh;display:flex;flex-direction:column;overflow:hidden;font-size:14px}

/* HEADER */
.header{background:var(--surface);border-bottom:1px solid var(--border);padding:0 16px;height:52px;display:flex;align-items:center;gap:12px;flex-shrink:0}
.logo{font-size:15px;font-weight:700;color:var(--text);display:flex;align-items:center;gap:7px}
.logo-icon{width:26px;height:26px;background:var(--accent);border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:13px}
.search-wrap{flex:1;max-width:360px;position:relative}
.search-icon{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--text3);pointer-events:none}
#searchInput{width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius-sm);color:var(--text);padding:7px 10px 7px 32px;font-size:13px;outline:none;transition:border-color .15s}
#searchInput:focus{border-color:var(--accent-border)}
#searchInput::placeholder{color:var(--text3)}
.shortcut-hint{font-size:11px;color:var(--text3);background:var(--surface2);border:1px solid var(--border);padding:2px 7px;border-radius:5px;position:absolute;right:8px;top:50%;transform:translateY(-50%);pointer-events:none}
.header-actions{margin-left:auto;display:flex;gap:8px;align-items:center}
.btn-icon{background:none;border:1px solid var(--border);color:var(--text2);border-radius:var(--radius-sm);width:32px;height:32px;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:16px;transition:all .15s}
.btn-icon:hover{border-color:var(--border2);color:var(--text);background:var(--surface2)}
.btn-primary{background:var(--accent);color:#fff;border:none;border-radius:var(--radius-sm);padding:0 14px;height:32px;font-size:13px;font-weight:500;cursor:pointer;display:flex;align-items:center;gap:6px;transition:opacity .15s}
.btn-primary:hover{opacity:.88}

/* TABS */
.tab-bar{display:flex;border-bottom:1px solid var(--border);background:var(--surface);flex-shrink:0}
.tab-btn{padding:10px 18px;font-size:13px;color:var(--text2);background:none;border:none;border-bottom:2px solid transparent;cursor:pointer;transition:all .15s}
.tab-btn:hover{color:var(--text)}
.tab-btn.active{color:var(--accent2);border-bottom-color:var(--accent)}

/* LAYOUT */
.app-body{display:flex;flex:1;overflow:hidden}
.tab-panel{display:none;flex:1;flex-direction:column;overflow:hidden}
.tab-panel.active{display:flex}

/* SIDEBAR */
.sidebar{width:200px;background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;flex-shrink:0;overflow-y:auto}
.sidebar-section{padding:10px 8px 4px}
.sidebar-label{font-size:10px;font-weight:600;letter-spacing:.8px;text-transform:uppercase;color:var(--text3);padding:0 6px;margin-bottom:4px}
.cat-item{display:flex;align-items:center;gap:8px;padding:7px 8px;border-radius:var(--radius-sm);cursor:pointer;color:var(--text2);font-size:13px;transition:all .12s}
.cat-item:hover{background:var(--surface2);color:var(--text)}
.cat-item.active{background:var(--accent-bg);color:var(--accent2)}
.cat-icon{font-size:15px;width:18px;text-align:center}
.cat-count{margin-left:auto;font-size:11px;color:var(--text3);background:var(--surface2);padding:1px 6px;border-radius:20px}
.cat-item.active .cat-count{background:var(--accent-bg);color:var(--accent)}
.sidebar-divider{border:none;border-top:1px solid var(--border);margin:6px 8px}
.add-cat-btn{display:flex;align-items:center;gap:8px;padding:7px 8px;border-radius:var(--radius-sm);cursor:pointer;color:var(--text3);font-size:13px;width:100%;background:none;border:none;transition:all .12s}
.add-cat-btn:hover{color:var(--text2);background:var(--surface2)}

/* MAIN */
.main{flex:1;display:flex;flex-direction:column;overflow:hidden}
.main-toolbar{padding:10px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px}
.filter-tab{background:none;border:none;color:var(--text2);font-size:13px;padding:4px 10px;border-radius:var(--radius-sm);cursor:pointer;transition:all .12s}
.filter-tab:hover,.filter-tab.active{background:var(--surface2);color:var(--text)}

/* GRID */
.snippets-grid,.checklists-grid{flex:1;overflow-y:auto;padding:14px 16px;display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:10px;align-content:start}
.snippets-grid::-webkit-scrollbar,.checklists-grid::-webkit-scrollbar{width:5px}
.snippets-grid::-webkit-scrollbar-thumb,.checklists-grid::-webkit-scrollbar-thumb{background:var(--surface3);border-radius:10px}

/* CARDS */
.snippet-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px;cursor:pointer;transition:all .15s;display:flex;flex-direction:column;gap:8px;position:relative}
.snippet-card:hover{border-color:var(--border2);background:var(--surface2);transform:translateY(-1px)}
.snippet-card.pinned{border-color:var(--accent-border)}
.card-header{display:flex;align-items:flex-start;gap:8px}
.card-title{font-size:13px;font-weight:600;color:var(--text);flex:1;line-height:1.3}
.card-actions{display:flex;gap:4px;opacity:0;transition:opacity .12s}
.snippet-card:hover .card-actions{opacity:1}
.card-action-btn{background:none;border:none;color:var(--text3);cursor:pointer;font-size:14px;padding:2px;border-radius:4px;transition:all .12s}
.card-action-btn:hover{color:var(--text);background:var(--surface3)}
.card-content{font-size:12px;color:var(--text2);line-height:1.6;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;white-space:pre-wrap}
.card-footer{display:flex;align-items:center;gap:6px}
.tag-pill{font-size:10px;padding:2px 8px;border-radius:20px;font-weight:500}
.card-date{font-size:11px;color:var(--text3);margin-left:auto}
.pin-badge{font-size:10px;color:var(--accent2);position:absolute;top:10px;right:10px}

/* CHECKLIST PREVIEW */
.checklist-preview{display:flex;flex-direction:column;gap:3px}
.cl-preview-item{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--text2)}
.progress-bar{height:3px;background:var(--surface3);border-radius:10px;overflow:hidden;margin-top:2px}
.progress-fill{height:100%;background:var(--accent);border-radius:10px;transition:width .3s}
.cl-progress{font-size:11px;color:var(--text3)}

/* EMPTY */
.empty-state{grid-column:1/-1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:60px 20px;gap:12px;color:var(--text3);text-align:center}
.empty-state .big-icon{font-size:40px;margin-bottom:4px}
.empty-state h3{font-size:15px;color:var(--text2);font-weight:500}
.empty-state p{font-size:13px;max-width:280px;line-height:1.6}

/* MODAL */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);backdrop-filter:blur(4px);display:none;align-items:center;justify-content:center;z-index:100}
.modal-overlay.open{display:flex}
.modal{background:var(--surface);border:1px solid var(--border2);border-radius:14px;width:92%;max-width:560px;max-height:88vh;display:flex;flex-direction:column;overflow:hidden}
.modal-header{padding:16px 18px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px}
.modal-title{font-size:14px;font-weight:600;color:var(--text);flex:1}
.modal-body{padding:18px;display:flex;flex-direction:column;gap:14px;overflow-y:auto}
.modal-footer{padding:14px 18px;border-top:1px solid var(--border);display:flex;gap:8px;justify-content:flex-end}
.form-group{display:flex;flex-direction:column;gap:6px}
.form-label{font-size:12px;color:var(--text2);font-weight:500}
.form-input,.form-textarea,.form-select{background:var(--surface2);border:1px solid var(--border);color:var(--text);border-radius:var(--radius-sm);font-size:13px;padding:9px 12px;outline:none;transition:border-color .15s;font-family:inherit;width:100%}
.form-input:focus,.form-textarea:focus,.form-select:focus{border-color:var(--accent-border)}
.form-input::placeholder,.form-textarea::placeholder{color:var(--text3)}
.form-textarea{resize:vertical;min-height:120px;line-height:1.6;font-family:'SF Mono','Fira Code',monospace;font-size:12.5px}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.btn-secondary{background:none;border:1px solid var(--border2);color:var(--text2);border-radius:var(--radius-sm);padding:0 14px;height:34px;font-size:13px;cursor:pointer;transition:all .15s}
.btn-secondary:hover{background:var(--surface2);color:var(--text)}
.btn-danger{background:rgba(248,113,113,.1);border:1px solid rgba(248,113,113,.25);color:var(--red);border-radius:var(--radius-sm);padding:0 14px;height:34px;font-size:13px;cursor:pointer;margin-right:auto;transition:opacity .15s}
.btn-danger:hover{opacity:.8}
.type-toggle{display:flex;gap:6px}
.type-btn{background:var(--surface2);border:1px solid var(--border);color:var(--text2);border-radius:var(--radius-sm);padding:5px 14px;font-size:12px;cursor:pointer;transition:all .15s}
.type-btn.active{background:var(--accent-bg);border-color:var(--accent-border);color:var(--accent2)}

/* VIEW MODAL */
.view-content{background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:14px;font-family:'SF Mono','Fira Code',monospace;font-size:12.5px;line-height:1.7;white-space:pre-wrap;color:var(--text);max-height:300px;overflow-y:auto}
.copy-success{font-size:12px;color:var(--green);display:flex;align-items:center;gap:5px;opacity:0;transition:opacity .2s}
.copy-success.show{opacity:1}

/* CHECKLIST VIEW */
.checklist-items{display:flex;flex-direction:column;gap:6px}
.checklist-item{display:flex;align-items:flex-start;gap:8px;padding:4px 0}
.checklist-item input[type=checkbox]{width:15px;height:15px;margin-top:2px;flex-shrink:0;accent-color:var(--accent);cursor:pointer}
.checklist-item label{font-size:13px;color:var(--text);line-height:1.5;cursor:pointer;transition:color .15s}
.checklist-item input:checked+label{color:var(--text3);text-decoration:line-through}

/* ITEMS EDITOR */
.item-editor-row{display:flex;align-items:center;gap:8px;background:var(--surface2);border-radius:var(--radius-sm);padding:6px 10px}
.add-item-row{display:flex;gap:8px;margin-top:4px}

/* TOAST */
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(10px);background:var(--surface2);border:1px solid var(--border2);border-radius:8px;padding:10px 16px;font-size:13px;color:var(--text);opacity:0;transition:all .25s;z-index:200;display:flex;align-items:center;gap:8px;min-width:200px;text-align:center;justify-content:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* CAT COLORS */
.cat-general{background:rgba(144,144,160,.12);color:#9090a0}
.cat-prompts{background:rgba(124,107,255,.12);color:#9b8dff}
.cat-trabajo{background:rgba(74,222,128,.1);color:#4ade80}
.cat-personal{background:rgba(251,191,36,.1);color:#fbbf24}
.cat-dev{background:rgba(56,189,248,.1);color:#38bdf8}
.cat-custom{background:rgba(248,113,113,.1);color:#f87171}
.sidebar::-webkit-scrollbar{width:4px}
.sidebar::-webkit-scrollbar-thumb{background:var(--surface3);border-radius:4px}
</style>
</head>
<body>

<div class="header">
  <div class="logo"><div class="logo-icon">⚡</div>SnapNotes</div>
  <div class="search-wrap">
    <span class="search-icon">🔍</span>
    <input type="text" id="searchInput" placeholder="Buscar... (Ctrl+K)" autocomplete="off">
    <span class="shortcut-hint">Ctrl+K</span>
  </div>
  <div class="header-actions">
    <button class="btn-icon" title="Importar" onclick="importData()">📥</button>
    <button class="btn-icon" title="Exportar" onclick="exportData()">📤</button>
    <button class="btn-primary" onclick="openNew()">＋ Nuevo</button>
  </div>
</div>

<div class="tab-bar">
  <button class="tab-btn active" id="tabSnippets" onclick="switchTab('snippets')">⚡ Snippets</button>
  <button class="tab-btn" id="tabChecklists" onclick="switchTab('checklists')">✅ Checklists</button>
</div>

<!-- TAB SNIPPETS -->
<div class="tab-panel active" id="panelSnippets">
  <div class="app-body">
    <div class="sidebar">
      <div class="sidebar-section">
        <div class="sidebar-label">Vistas</div>
        <div class="cat-item active" onclick="selectCat(this,'all')">
          <span class="cat-icon">📋</span>Todos<span class="cat-count" id="cnt-all">0</span>
        </div>
        <div class="cat-item" onclick="selectCat(this,'pinned')">
          <span class="cat-icon">📌</span>Fijados<span class="cat-count" id="cnt-pinned">0</span>
        </div>
      </div>
      <hr class="sidebar-divider">
      <div class="sidebar-section">
        <div class="sidebar-label">Categorías</div>
        <div id="catList"></div>
      </div>
      <div style="padding:6px 8px">
        <button class="add-cat-btn" onclick="addCategory()"><span style="font-size:16px">＋</span>Categoría</button>
      </div>
    </div>
    <div class="main">
      <div class="main-toolbar">
        <button class="filter-tab active" onclick="setSort(this,'recent')">Recientes</button>
        <button class="filter-tab" onclick="setSort(this,'alpha')">A–Z</button>
        <button class="filter-tab" onclick="setSort(this,'oldest')">Antiguos</button>
        <span style="font-size:12px;color:var(--text3);margin-left:6px" id="countLabel"></span>
      </div>
      <div class="snippets-grid" id="snippetsGrid"></div>
    </div>
  </div>
</div>

<!-- TAB CHECKLISTS -->
<div class="tab-panel" id="panelChecklists">
  <div class="main-toolbar">
    <span style="font-size:13px;color:var(--text2)" id="clCountLabel">0 checklists</span>
    <button class="btn-primary" style="margin-left:auto" onclick="openNewCL()">＋ Nueva checklist</button>
  </div>
  <div class="checklists-grid" id="checklistsGrid"></div>
</div>

<!-- EDIT MODAL (snippets y checklists) -->
<div class="modal-overlay" id="editModal">
  <div class="modal">
    <div class="modal-header">
      <div class="modal-title" id="modalTitle">Nuevo snippet</div>
      <button class="btn-icon" onclick="closeModal('editModal')" style="border:none;font-size:18px">✕</button>
    </div>
    <div class="modal-body">
      <div class="form-group" id="typeGroup">
        <label class="form-label">Tipo</label>
        <div class="type-toggle">
          <button class="type-btn active" id="typeText" onclick="setType('text')">📝 Texto</button>
          <button class="type-btn" id="typeCheck" onclick="setType('checklist')">✅ Checklist</button>
        </div>
      </div>
      <div class="form-group">
        <label class="form-label">Título *</label>
        <input type="text" class="form-input" id="fTitle" placeholder="Título del snippet">
      </div>
      <div class="form-group" id="contentGroup">
        <label class="form-label">Contenido *</label>
        <textarea class="form-textarea" id="fContent" placeholder="Escribe o pega tu texto, prompt o información..."></textarea>
      </div>
      <div class="form-group" id="checklistGroup" style="display:none">
        <label class="form-label">Ítems</label>
        <div id="itemsEditor" style="display:flex;flex-direction:column;gap:6px;margin-bottom:8px"></div>
        <div class="add-item-row">
          <input type="text" class="form-input" id="newItemInput" placeholder="Nuevo ítem..." onkeydown="if(event.key==='Enter')addItem()">
          <button class="btn-secondary" onclick="addItem()" style="white-space:nowrap">＋ Agregar</button>
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label class="form-label">Categoría</label>
          <select class="form-select" id="fCat"></select>
        </div>
        <div class="form-group">
          <label class="form-label">Etiqueta</label>
          <input type="text" class="form-input" id="fTag" placeholder="Ej: IA, trabajo...">
        </div>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn-danger" id="deleteBtn" onclick="deleteItem()" style="display:none">🗑 Eliminar</button>
      <button class="btn-secondary" onclick="closeModal('editModal')">Cancelar</button>
      <button class="btn-primary" id="saveBtn" onclick="saveItem()">💾 Guardar</button>
    </div>
  </div>
</div>

<!-- VIEW MODAL -->
<div class="modal-overlay" id="viewModal">
  <div class="modal">
    <div class="modal-header">
      <div class="modal-title" id="viewTitle">-</div>
      <button class="btn-icon" onclick="closeModal('viewModal')" style="border:none;font-size:18px">✕</button>
    </div>
    <div class="modal-body">
      <div style="display:flex;gap:6px;flex-wrap:wrap;align-items:center" id="viewMeta"></div>
      <div id="viewContent" class="view-content"></div>
      <div style="display:flex;align-items:center;gap:10px">
        <button class="btn-primary" onclick="copyView()" id="copyBtn">📋 Copiar</button>
        <span class="copy-success" id="copySuccess">✓ ¡Copiado!</span>
        <button class="btn-secondary" style="margin-left:auto" onclick="editFromView()">✏️ Editar</button>
      </div>
    </div>
  </div>
</div>

<!-- SETUP MODAL -->
<div class="modal-overlay" id="setupModal" style="z-index:200">
  <div class="modal" style="max-width:440px">
    <div class="modal-header"><div class="modal-title">⚡ Configurar SnapNotes</div></div>
    <div class="modal-body" style="gap:16px">
      <p style="font-size:13px;color:var(--text2);line-height:1.6">
        Para sincronizar en la nube ingresa tu <strong style="color:var(--text)">API Key de JSONBin</strong>. Se guarda solo en tu navegador.
      </p>
      <div class="form-group">
        <label class="form-label">API Key <span style="color:var(--text3)">(empieza con $2a$...)</span></label>
        <input type="password" class="form-input" id="setupKey" placeholder="$2a$10$...">
      </div>
      <div style="display:flex;gap:8px">
        <button class="btn-primary" style="flex:1" onclick="saveSetup()">✅ Guardar y continuar</button>
        <button class="btn-secondary" onclick="skipSetup()">Usar sin nube</button>
      </div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>
<input type="file" id="importFile" accept=".json" style="display:none" onchange="handleImport(event)">

<script>
// ═══════════════════════════════════
//  CONFIG
// ═══════════════════════════════════
const JB_BIN = '6a3c713ef5f4af5e292be11f';
const JB_URL = `https://api.jsonbin.io/v3/b/${JB_BIN}`;
function getKey(){ return localStorage.getItem('snapnotes_jbkey')||''; }

// ═══════════════════════════════════
//  STATE
// ═══════════════════════════════════
let snippets   = [];
let categories = ['General','Prompts','Trabajo','Personal','Dev'];
let clLists    = [];

let currentCat  = 'all';
let currentSort = 'recent';
let editingId   = null;
let editingKind = 'snippet'; // 'snippet' | 'checklist'
let viewingId   = null;
let viewingKind = 'snippet';
let currentType = 'text';
let editItems   = [];

// ═══════════════════════════════════
//  HELPERS
// ═══════════════════════════════════
const catColors = {General:'cat-general',Prompts:'cat-prompts',Trabajo:'cat-trabajo',Personal:'cat-personal',Dev:'cat-dev'};
const catIcons  = {General:'📂',Prompts:'🤖',Trabajo:'💼',Personal:'🏠',Dev:'💻'};
function getCatColor(c){ return catColors[c]||'cat-custom'; }
function getCatIcon(c) { return catIcons[c]||'🏷'; }
function uid(){ return Date.now().toString(36)+Math.random().toString(36).substr(2,5); }
function esc(t){ return String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

let toastTimer;
function showToast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg; t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>t.classList.remove('show'),2400);
}
function closeModal(id){ document.getElementById(id).classList.remove('open'); }

// ═══════════════════════════════════
//  STORAGE
// ═══════════════════════════════════
function saveLocal(){
  localStorage.setItem('sn_snippets',   JSON.stringify(snippets));
  localStorage.setItem('sn_categories', JSON.stringify(categories));
  localStorage.setItem('sn_checklists', JSON.stringify(clLists));
}
function loadLocal(){
  try{ snippets   = JSON.parse(localStorage.getItem('sn_snippets'))   || []; }catch(e){ snippets=[]; }
  try{ categories = JSON.parse(localStorage.getItem('sn_categories')) || ['General','Prompts','Trabajo','Personal','Dev']; }catch(e){ categories=['General','Prompts','Trabajo','Personal','Dev']; }
  try{ clLists    = JSON.parse(localStorage.getItem('sn_checklists')) || []; }catch(e){ clLists=[]; }
}
async function saveCloud(){
  const key = getKey(); if(!key) return;
  try{
    await fetch(JB_URL,{
      method:'PUT',
      headers:{'Content-Type':'application/json','X-Master-Key':key},
      body:JSON.stringify({snippets,categories,clLists})
    });
  }catch(e){ console.warn('Cloud save failed',e); }
}
async function loadCloud(){
  const key = getKey(); if(!key) return false;
  try{
    const r = await fetch(JB_URL+'/latest',{headers:{'X-Master-Key':key}});
    if(!r.ok) return false;
    const j = await r.json();
    const d = j.record;
    if(d && d.snippets){ snippets=d.snippets; categories=d.categories||categories; clLists=d.clLists||[]; return true; }
  }catch(e){ console.warn('Cloud load failed',e); }
  return false;
}
function save(){ saveLocal(); saveCloud(); }

// ═══════════════════════════════════
//  SEED
// ═══════════════════════════════════
function seedIfEmpty(){
  if(snippets.length>0) return;
  snippets=[
    {id:uid(),title:'Prompt: resumen ejecutivo',content:'Por favor, resume el siguiente texto en máximo 5 puntos clave:\n\n[PEGAR TEXTO AQUÍ]',cat:'Prompts',tag:'IA',type:'text',items:[],pinned:true,created:Date.now()-86400000*3},
    {id:uid(),title:'Email de seguimiento',content:'Asunto: Seguimiento – [tema]\n\nHola [Nombre],\n\nEspero que estés bien.\n\nSaludos,\n[Tu nombre]',cat:'Trabajo',tag:'email',type:'text',items:[],pinned:false,created:Date.now()-86400000},
    {id:uid(),title:'Prompt: corrección de texto',content:'Corrige ortografía y estilo del siguiente texto:\n\n[TEXTO]',cat:'Prompts',tag:'IA',type:'text',items:[],pinned:false,created:Date.now()-86400000*2},
    {id:uid(),title:'Snippet SQL básico',content:'SELECT id, nombre\nFROM tabla\nWHERE activo=1\nORDER BY id DESC\nLIMIT 50;',cat:'Dev',tag:'SQL',type:'text',items:[],pinned:false,created:Date.now()-3600000},
  ];
}

// ═══════════════════════════════════
//  RENDER
// ═══════════════════════════════════
function render(){ renderSidebar(); renderGrid(); renderCLGrid(); }

function renderSidebar(){
  document.getElementById('cnt-all').textContent    = snippets.length;
  document.getElementById('cnt-pinned').textContent = snippets.filter(s=>s.pinned).length;
  const fCat = document.getElementById('fCat');
  const prev = fCat.value;
  fCat.innerHTML = categories.map(c=>`<option value="${c}">${c}</option>`).join('');
  if(prev) fCat.value=prev;
  const catList = document.getElementById('catList');
  catList.innerHTML = categories.map(cat=>{
    const n = snippets.filter(s=>s.cat===cat).length;
    const active = currentCat===cat?' active':'';
    return `<div class="cat-item${active}" onclick="selectCat(this,'${cat}')">
      <span class="cat-icon">${getCatIcon(cat)}</span>${cat}<span class="cat-count">${n}</span>
    </div>`;
  }).join('');
}

function renderGrid(){
  const q = document.getElementById('searchInput').value.toLowerCase().trim();
  let items = [...snippets];
  if(currentCat==='pinned') items=items.filter(s=>s.pinned);
  else if(currentCat!=='all') items=items.filter(s=>s.cat===currentCat);
  if(q) items=items.filter(s=>
    s.title.toLowerCase().includes(q)||
    (s.content&&s.content.toLowerCase().includes(q))||
    (s.tag&&s.tag.toLowerCase().includes(q))||
    s.cat.toLowerCase().includes(q)||
    (s.items&&s.items.some(it=>it.toLowerCase().includes(q)))
  );
  if(currentSort==='alpha') items.sort((a,b)=>a.title.localeCompare(b.title));
  else if(currentSort==='oldest') items.sort((a,b)=>a.created-b.created);
  else items.sort((a,b)=>{ if(a.pinned!==b.pinned) return a.pinned?-1:1; return b.created-a.created; });

  document.getElementById('countLabel').textContent=items.length+' snippet'+(items.length!==1?'s':'');
  const grid=document.getElementById('snippetsGrid');
  if(items.length===0){
    grid.innerHTML=`<div class="empty-state"><div class="big-icon">🔍</div><h3>${q?'Sin resultados':'Sin snippets'}</h3><p>${q?'Prueba otros términos.':'Crea uno con "+ Nuevo".'}</p></div>`;
    return;
  }
  grid.innerHTML=items.map(s=>{
    const date=new Date(s.created).toLocaleDateString('es-CO',{day:'2-digit',month:'short'});
    const tagHtml=s.tag?`<span class="tag-pill ${getCatColor(s.cat)}">${esc(s.tag)}</span>`:'';
    const catHtml=`<span class="tag-pill cat-general" style="background:rgba(255,255,255,.06);color:var(--text3)">${esc(s.cat)}</span>`;
    const isCL = s.type==='checklist';
    // Body
    let bodyHtml;
    if(isCL){
      const its=s.items||[];
      if(its.length===0){
        bodyHtml='<div class="checklist-preview"><span style="font-size:12px;color:var(--text3)">Sin ítems</span></div>';
      } else {
        const rows=its.slice(0,4).map(it=>`<div class="cl-preview-item"><span>☐</span><span>${esc(it)}</span></div>`).join('');
        const more=its.length>4?`<div style="font-size:11px;color:var(--text3)">+${its.length-4} más</div>`:'';
        bodyHtml=`<div class="checklist-preview">${rows}${more}</div>`;
      }
    } else {
      bodyHtml=`<div class="card-content">${esc(s.content||'')}</div>`;
    }
    const copyBtn=isCL?'': `<button class="card-action-btn" title="Copiar" onclick="event.stopPropagation();quickCopy('${s.id}')">📋</button>`;
    return `<div class="snippet-card${s.pinned?' pinned':''}" onclick="viewSnippet('${s.id}')">
      ${s.pinned?'<div class="pin-badge">📌</div>':''}
      <div class="card-header">
        <div class="card-title">${isCL?'✅ ':''}${esc(s.title)}</div>
        <div class="card-actions">
          <button class="card-action-btn" title="${s.pinned?'Desfijar':'Fijar'}" onclick="event.stopPropagation();togglePin('${s.id}')">${s.pinned?'📌':'📍'}</button>
          ${copyBtn}
          <button class="card-action-btn" title="Editar" onclick="event.stopPropagation();openEdit('${s.id}')">✏️</button>
        </div>
      </div>
      ${bodyHtml}
      <div class="card-footer">${catHtml}${tagHtml}<span class="card-date">${date}</span></div>
    </div>`;
  }).join('');
}

function renderCLGrid(){
  const grid=document.getElementById('checklistsGrid');
  document.getElementById('clCountLabel').textContent=clLists.length+' checklist'+(clLists.length!==1?'s':'');
  if(clLists.length===0){
    grid.innerHTML=`<div class="empty-state"><div class="big-icon">✅</div><h3>Sin checklists</h3><p>Crea una con el botón "+ Nueva checklist".</p></div>`;
    return;
  }
  grid.innerHTML=clLists.map(cl=>{
    const total=cl.items.length;
    const done=cl.items.filter((_,i)=>cl.checked&&cl.checked[i]).length;
    const pct=total>0?Math.round(done/total*100):0;
    const rows=cl.items.slice(0,5).map((it,i)=>{
      const chk=cl.checked&&cl.checked[i];
      return `<div class="cl-preview-item">${chk?'✅':'☐'} <span style="${chk?'text-decoration:line-through;color:var(--text3)':''}">${esc(it)}</span></div>`;
    }).join('');
    const more=cl.items.length>5?`<div style="font-size:11px;color:var(--text3)">+${cl.items.length-5} más</div>`:'';
    return `<div class="snippet-card" onclick="viewCL('${cl.id}')">
      <div class="card-header">
        <div class="card-title">✅ ${esc(cl.title)}</div>
        <div class="card-actions">
          <button class="card-action-btn" onclick="event.stopPropagation();openEditCL('${cl.id}')">✏️</button>
          <button class="card-action-btn" onclick="event.stopPropagation();deleteCL('${cl.id}')">🗑</button>
        </div>
      </div>
      <div class="checklist-preview">${rows}${more}</div>
      <div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div>
      <div class="cl-progress">${done}/${total} completados</div>
    </div>`;
  }).join('');
}

// ═══════════════════════════════════
//  TABS
// ═══════════════════════════════════
let activeTab='snippets';
function switchTab(tab){
  activeTab=tab;
  document.getElementById('tabSnippets').classList.toggle('active',tab==='snippets');
  document.getElementById('tabChecklists').classList.toggle('active',tab==='checklists');
  document.getElementById('panelSnippets').classList.toggle('active',tab==='snippets');
  document.getElementById('panelChecklists').classList.toggle('active',tab==='checklists');
  document.getElementById('typeGroup').style.display = tab==='snippets' ? '' : 'none';
}

// ═══════════════════════════════════
//  SIDEBAR / SORT
// ═══════════════════════════════════
function selectCat(el,cat){
  document.querySelectorAll('.cat-item').forEach(e=>e.classList.remove('active'));
  el.classList.add('active'); currentCat=cat; renderGrid();
}
function setSort(el,sort){
  document.querySelectorAll('.filter-tab').forEach(e=>e.classList.remove('active'));
  el.classList.add('active'); currentSort=sort; renderGrid();
}
function addCategory(){
  const n=(prompt('Nombre de la categoría:')||'').trim();
  if(!n) return;
  if(categories.includes(n)){ showToast('⚠️ Ya existe'); return; }
  categories.push(n); save(); renderSidebar(); showToast(`✅ "${n}" creada`);
}

// ═══════════════════════════════════
//  TYPE TOGGLE
// ═══════════════════════════════════
function setType(t){
  currentType=t;
  document.getElementById('typeText').classList.toggle('active',t==='text');
  document.getElementById('typeCheck').classList.toggle('active',t==='checklist');
  document.getElementById('contentGroup').style.display=t==='text'?'':'none';
  document.getElementById('checklistGroup').style.display=t==='checklist'?'':'none';
}
function addItem(){
  const inp=document.getElementById('newItemInput');
  const v=inp.value.trim(); if(!v) return;
  editItems.push(v); inp.value=''; renderItemsEditor(); inp.focus();
}
function removeItem(i){ editItems.splice(i,1); renderItemsEditor(); }
function renderItemsEditor(){
  document.getElementById('itemsEditor').innerHTML=editItems.map((it,i)=>
    `<div class="item-editor-row">
      <span style="flex:1;font-size:13px;color:var(--text)">☐ ${esc(it)}</span>
      <button onclick="removeItem(${i})" style="background:none;border:none;color:var(--text3);cursor:pointer;font-size:14px">✕</button>
    </div>`
  ).join('');
}

// ═══════════════════════════════════
//  OPEN / EDIT MODALS
// ═══════════════════════════════════
function openNew(){
  editingId=null; editingKind='snippet'; currentType='text'; editItems=[];
  document.getElementById('modalTitle').textContent='Nuevo snippet';
  document.getElementById('fTitle').value='';
  document.getElementById('fContent').value='';
  document.getElementById('fCat').value=currentCat!=='all'&&currentCat!=='pinned'?currentCat:'General';
  document.getElementById('fTag').value='';
  document.getElementById('deleteBtn').style.display='none';
  document.getElementById('typeGroup').style.display='';
  setType('text'); renderItemsEditor();
  document.getElementById('editModal').classList.add('open');
  setTimeout(()=>document.getElementById('fTitle').focus(),80);
}
function openEdit(id){
  const s=snippets.find(x=>x.id===id); if(!s) return;
  editingId=id; editingKind='snippet';
  currentType=s.type||'text'; editItems=[...(s.items||[])];
  document.getElementById('modalTitle').textContent='Editar snippet';
  document.getElementById('fTitle').value=s.title;
  document.getElementById('fContent').value=s.content||'';
  document.getElementById('fCat').value=s.cat;
  document.getElementById('fTag').value=s.tag||'';
  document.getElementById('deleteBtn').style.display='block';
  document.getElementById('typeGroup').style.display='';
  setType(currentType); renderItemsEditor();
  document.getElementById('editModal').classList.add('open');
}
function openNewCL(){
  editingId=null; editingKind='checklist'; currentType='checklist'; editItems=[];
  document.getElementById('modalTitle').textContent='Nueva checklist';
  document.getElementById('fTitle').value='';
  document.getElementById('fCat').value='General';
  document.getElementById('fTag').value='';
  document.getElementById('deleteBtn').style.display='none';
  document.getElementById('typeGroup').style.display='none';
  setType('checklist'); renderItemsEditor();
  document.getElementById('editModal').classList.add('open');
  setTimeout(()=>document.getElementById('fTitle').focus(),80);
}
function openEditCL(id){
  const cl=clLists.find(x=>x.id===id); if(!cl) return;
  editingId=id; editingKind='checklist'; currentType='checklist'; editItems=[...cl.items];
  document.getElementById('modalTitle').textContent='Editar checklist';
  document.getElementById('fTitle').value=cl.title;
  document.getElementById('fCat').value='General';
  document.getElementById('fTag').value='';
  document.getElementById('deleteBtn').style.display='block';
  document.getElementById('typeGroup').style.display='none';
  setType('checklist'); renderItemsEditor();
  document.getElementById('editModal').classList.add('open');
}
function editFromView(){
  closeModal('viewModal');
  if(viewingKind==='checklist') openEditCL(viewingId);
  else openEdit(viewingId);
}

// ═══════════════════════════════════
//  SAVE / DELETE
// ═══════════════════════════════════
function saveItem(){
  const title=document.getElementById('fTitle').value.trim();
  const cat=document.getElementById('fCat').value;
  const tag=document.getElementById('fTag').value.trim();
  if(!title){ showToast('⚠️ El título es requerido'); return; }

  if(editingKind==='checklist'){
    if(editItems.length===0){ showToast('⚠️ Agrega al menos un ítem'); return; }
    if(editingId){
      const cl=clLists.find(x=>x.id===editingId);
      if(cl){ cl.title=title; cl.items=[...editItems]; cl.checked=new Array(editItems.length).fill(false); }
    } else {
      clLists.push({id:uid(),title,items:[...editItems],checked:new Array(editItems.length).fill(false),created:Date.now()});
    }
    save(); render(); closeModal('editModal'); showToast('✅ Checklist guardada');
    return;
  }

  // Snippet
  if(currentType==='checklist'){
    if(editItems.length===0){ showToast('⚠️ Agrega al menos un ítem'); return; }
    if(editingId){
      const s=snippets.find(x=>x.id===editingId);
      if(s){ s.title=title; s.content=''; s.cat=cat; s.tag=tag; s.type='checklist'; s.items=[...editItems]; }
    } else {
      snippets.push({id:uid(),title,content:'',cat,tag,type:'checklist',items:[...editItems],pinned:false,created:Date.now()});
    }
  } else {
    const content=document.getElementById('fContent').value.trim();
    if(!content){ showToast('⚠️ El contenido es requerido'); return; }
    if(editingId){
      const s=snippets.find(x=>x.id===editingId);
      if(s){ s.title=title; s.content=content; s.cat=cat; s.tag=tag; s.type='text'; s.items=[]; }
    } else {
      snippets.push({id:uid(),title,content,cat,tag,type:'text',items:[],pinned:false,created:Date.now()});
    }
  }
  save(); render(); closeModal('editModal'); showToast('✅ Guardado');
}

function deleteItem(){
  if(!editingId) return;
  if(!confirm('¿Eliminar?')) return;
  if(editingKind==='checklist'){
    clLists=clLists.filter(x=>x.id!==editingId);
  } else {
    snippets=snippets.filter(x=>x.id!==editingId);
  }
  save(); render(); closeModal('editModal'); showToast('🗑 Eliminado');
}

// ═══════════════════════════════════
//  PIN / COPY
// ═══════════════════════════════════
function togglePin(id){
  const s=snippets.find(x=>x.id===id);
  if(s){ s.pinned=!s.pinned; save(); render(); }
}
function quickCopy(id){
  const s=snippets.find(x=>x.id===id); if(!s) return;
  navigator.clipboard.writeText(s.content).then(()=>showToast('📋 Copiado'));
}

// ═══════════════════════════════════
//  VIEW MODALS
// ═══════════════════════════════════
function viewSnippet(id){
  const s=snippets.find(x=>x.id===id); if(!s) return;
  viewingId=id; viewingKind='snippet';
  document.getElementById('viewTitle').textContent=(s.type==='checklist'?'✅ ':'')+s.title;
  const date=new Date(s.created).toLocaleDateString('es-CO',{dateStyle:'long'});
  document.getElementById('viewMeta').innerHTML=
    `<span class="tag-pill ${getCatColor(s.cat)}">${getCatIcon(s.cat)} ${s.cat}</span>`+
    (s.tag?`<span class="tag-pill cat-general" style="background:rgba(255,255,255,.06);color:var(--text2)">${esc(s.tag)}</span>`:'')+
    `<span style="font-size:11px;color:var(--text3);margin-left:4px">📅 ${date}</span>`;
  const vc=document.getElementById('viewContent');
  const cb=document.getElementById('copyBtn');
  if(s.type==='checklist'){
    const its=s.items||[];
    vc.innerHTML=`<div class="checklist-items">${its.map((it,i)=>
      `<div class="checklist-item">
        <input type="checkbox" id="cli_${i}">
        <label for="cli_${i}">${esc(it)}</label>
      </div>`).join('')}</div>`;
    vc.style.fontFamily='inherit'; vc.style.fontSize='13px';
    cb.style.display='none';
  } else {
    vc.textContent=s.content;
    vc.style.fontFamily=''; vc.style.fontSize='';
    cb.style.display='';
  }
  document.getElementById('copySuccess').classList.remove('show');
  document.getElementById('viewModal').classList.add('open');
}

function viewCL(id){
  const cl=clLists.find(x=>x.id===id); if(!cl) return;
  viewingId=id; viewingKind='checklist';
  document.getElementById('viewTitle').textContent='✅ '+cl.title;
  document.getElementById('viewMeta').innerHTML=`<span style="font-size:12px;color:var(--text3)">${cl.items.length} ítems</span>`;
  const vc=document.getElementById('viewContent');
  vc.innerHTML=`<div class="checklist-items">${cl.items.map((it,i)=>
    `<div class="checklist-item">
      <input type="checkbox" id="clv_${i}" ${cl.checked&&cl.checked[i]?'checked':''} onchange="toggleCLItem('${cl.id}',${i},this.checked)">
      <label for="clv_${i}">${esc(it)}</label>
    </div>`).join('')}</div>`;
  vc.style.fontFamily='inherit'; vc.style.fontSize='13px';
  document.getElementById('copyBtn').style.display='';
  document.getElementById('copyBtn').onclick = () => copyCL(id);
  document.getElementById('copySuccess').classList.remove('show');
  document.getElementById('viewModal').classList.add('open');
}

function toggleCLItem(id,i,val){
  const cl=clLists.find(x=>x.id===id); if(!cl) return;
  if(!cl.checked) cl.checked=new Array(cl.items.length).fill(false);
  cl.checked[i]=val; save(); renderCLGrid();
}

function copyView(){
  const s=snippets.find(x=>x.id===viewingId); if(!s) return;
  navigator.clipboard.writeText(s.content).then(()=>{
    const el=document.getElementById('copySuccess');
    el.classList.add('show'); setTimeout(()=>el.classList.remove('show'),2000);
  });
}
function copyCL(id){
  const cl=clLists.find(x=>x.id===id); if(!cl) return;
  const text = cl.items.map((it,i)=>{
    const chk = cl.checked&&cl.checked[i];
    return (chk?'☑':'☐')+' '+it;
  }).join('
');
  navigator.clipboard.writeText(text).then(()=>{
    const el=document.getElementById('copySuccess');
    el.classList.add('show'); setTimeout(()=>el.classList.remove('show'),2000);
  });
}

// ═══════════════════════════════════
//  IMPORT / EXPORT
// ═══════════════════════════════════
function exportData(){
  const blob=new Blob([JSON.stringify({snippets,categories,clLists},null,2)],{type:'application/json'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='snapnotes_backup_'+new Date().toISOString().slice(0,10)+'.json';
  a.click(); showToast('📤 Exportado');
}
function importData(){ document.getElementById('importFile').click(); }
function handleImport(e){
  const file=e.target.files[0]; if(!file) return;
  const r=new FileReader();
  r.onload=ev=>{
    try{
      const d=JSON.parse(ev.target.result);
      if(d.snippets){ const newS=d.snippets.filter(ns=>!snippets.find(s=>s.id===ns.id)); snippets.push(...newS); }
      if(d.categories) d.categories.forEach(c=>{ if(!categories.includes(c)) categories.push(c); });
      if(d.clLists){ const newCL=d.clLists.filter(nc=>!clLists.find(c=>c.id===nc.id)); clLists.push(...newCL); }
      save(); render(); showToast('📥 Importado');
    }catch{ showToast('❌ Archivo inválido'); }
  };
  r.readAsText(file); e.target.value='';
}

// ═══════════════════════════════════
//  SETUP (JSONBin)
// ═══════════════════════════════════
function saveSetup(){
  const k=document.getElementById('setupKey').value.trim();
  if(!k.startsWith('$2a$')){ showToast('⚠️ API Key inválida'); return; }
  localStorage.setItem('snapnotes_jbkey',k);
  document.getElementById('setupModal').classList.remove('open');
  init();
}
function skipSetup(){
  document.getElementById('setupModal').classList.remove('open');
  init();
}

// ═══════════════════════════════════
//  KEYBOARD
// ═══════════════════════════════════
document.addEventListener('keydown',e=>{
  if((e.ctrlKey||e.metaKey)&&e.key==='k'){ e.preventDefault(); document.getElementById('searchInput').focus(); document.getElementById('searchInput').select(); }
  if(e.key==='Escape'){ closeModal('editModal'); closeModal('viewModal'); }
  if((e.ctrlKey||e.metaKey)&&e.key==='n'){ e.preventDefault(); openNew(); }
});
document.getElementById('searchInput').addEventListener('input',renderGrid);
document.querySelectorAll('.modal-overlay').forEach(o=>o.addEventListener('click',e=>{ if(e.target===o) o.classList.remove('open'); }));

// ═══════════════════════════════════
//  INIT
// ═══════════════════════════════════
async function init(){
  loadLocal();
  const ok = await loadCloud();
  if(!ok) saveLocal(); // Si no hay nube, carga local
  seedIfEmpty();
  save();
  render();
}

if(!getKey()){
  document.getElementById('setupModal').classList.add('open');
} else {
  init();
}
</script>
